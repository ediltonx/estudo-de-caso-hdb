name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI - validar aplicacao
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Instalar ferramentas de qualidade
        run: pip install flake8 black isort pytest

      - name: Verificar formatacao com Black
        run: black --check todo_project --verbose || true

      - name: Verificar imports com isort
        run: isort --check-only todo_project --verbose || true

      - name: Lint com flake8
        run: flake8 todo_project --max-line-length=120 --count --statistics || true

      - name: Verificar sintaxe dos arquivos Python
        run: python -m compileall todo_project

      - name: Teste de importacao da aplicacao
        env:
          PYTHONPATH: ./todo_project
        run: python -c "from todo_project import app; print(app.name)"

      - name: Verificacao de seguranca com bandit
        run: pip install bandit && bandit -r todo_project -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload do relatorio de seguranca
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  cd:
    name: CD - publicar imagem no GHCR
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/estudo-de-caso-hdb
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}