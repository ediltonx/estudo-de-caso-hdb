name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI - validar aplicacao
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Instalar ferramentas de qualidade
        run: pip install flake8 black isort pytest

      - name: Verificar formatacao com Black
        run: black --check todo_project --verbose || true

      - name: Verificar imports com isort
        run: isort --check-only todo_project --verbose || true

      - name: Lint com flake8
        run: flake8 todo_project --max-line-length=120 --count --statistics || true

      - name: Verificar sintaxe dos arquivos Python
        run: python -m compileall todo_project

      - name: Teste de importacao da aplicacao
        env:
          PYTHONPATH: ./todo_project
        run: python -c "from todo_project import app; print(app.name)"

      - name: Rodar testes com pytest
        run: pytest todo_project/tests/ -v --tb=short --cov=todo_project --cov-report=term-missing || true

      - name: Upload relatorio de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

      - name: Verificacao de seguranca com bandit
        run: pip install bandit && bandit -r todo_project -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Checagem de dependencias
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          path: '.'
          format: 'HTML'
          args: >
            --enableExperimental

      - name: Upload relatorio Checagem de dependencias
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

      - name: Upload do relatorio de seguranca
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  review:
    name: Review - ambiente temporario
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment:
      name: review/pr-${{ github.event.number }}
      url: http://localhost:5000

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Subir a aplicacao para review
        run: |
          docker compose up -d app
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/about >/dev/null; then
              echo "Aplicacao pronta para review"
              docker compose logs app > review-app.log
              exit 0
            fi
            sleep 2
          done
          docker compose logs app > review-app.log || true
          exit 1

      - name: Upload dos logs do review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-logs-pr-${{ github.event.number }}
          path: review-app.log

  stage:
    name: Stage + DAST com OWASP ZAP
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: stage

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Preparar pasta de relatorios do ZAP
        run: |
          mkdir -p zap-reports
          chmod -R 777 zap-reports

      - name: Subir stage e executar DAST com ZAP
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from zap

      - name: Upload relatorios do ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: zap-reports/
