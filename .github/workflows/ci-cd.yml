name: CI/CD


on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI - validar aplicacao
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Instalar ferramentas de qualidade
        run: pip install flake8 black isort pytest

      - name: Verificar formatacao com Black
        run: black --check todo_project --verbose || true

      - name: Verificar imports com isort
        run: isort --check-only todo_project --verbose || true

      - name: Lint com flake8
        run: flake8 todo_project --max-line-length=120 --count --statistics || true

      - name: Verificar sintaxe dos arquivos Python
        run: python -m compileall todo_project

      - name: Teste de importacao da aplicacao
        env:
          PYTHONPATH: ./todo_project
        run: python -c "from todo_project import app; print(app.name)"

      - name: Rodar testes com pytest
        run: pytest todo_project/tests/ -v --tb=short --cov=todo_project --cov-report=term-missing || true

      - name: Upload relatorio de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

      - name: Verificacao de seguranca com bandit
        run: pip install bandit && bandit -r todo_project -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Checagem de dependencias
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          path: '.'
          format: 'HTML'
          args: >
            --enableExperimental

      - name: Upload relatorio Checagem de dependencias
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

      - name: Upload do relatorio de seguranca
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  cd:
    name: CD - buildar imagem Docker
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: estudo-de-caso-hdb:latest
          cache-from: type=gha
          cache-to: type=gha